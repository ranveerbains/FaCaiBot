services:
  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"   # Web console
      - "9009:9009"   # ILP ingestion (TCP)
      - "8812:8812"   # Postgres wire protocol
    volumes:
      - questdb_data:/var/lib/questdb
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      - vm.max_map_count=1048576

volumes:
  questdb_data:
