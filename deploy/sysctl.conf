# /etc/sysctl.d/99-facaibot.conf
# Low-latency network tuning for FaCaiBot trading server

# TCP: reduce latency over throughput
net.ipv4.tcp_low_latency = 1

# Increase socket buffer sizes (Binance SBE can burst)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Disable TCP timestamps (saves ~12 bytes per packet header)
net.ipv4.tcp_timestamps = 0

# Enable TCP fast open (reduces handshake RTT for reconnects)
net.ipv4.tcp_fastopen = 3

# Increase backlog for burst handling
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 5000

# Reduce TIME_WAIT duration
net.ipv4.tcp_fin_timeout = 15

# Disable swap (the bot should never page)
vm.swappiness = 0

# QuestDB memory-mapped file requirements
fs.file-max = 1048576
vm.max_map_count = 1048576
