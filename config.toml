
[rotation]
# Seconds before expiry to discover and pre-fetch the next market
prewarm_lead_secs = 20

[spike_detection]
# ATR multiplier for spike candidate trigger
multiplier = 30
# EMA smoothing for ATR (0.02 = 2.5s memory at 50ms ticks)
atr_alpha = 0.02
# Sustain duration (ms) before spike confirmation
sustain_ms = 300
# Minimum spike magnitude in bps (0.01 = 1 bp hard floor)
min_magnitude_pct = 0.015
# Minimum displacement/peak ratio at sustain time
momentum_ratio_min = 0.75

[entry_guards]
# Maximum bid-ask spread in dollars
max_spread = 0.025
# Minimum book depth as fraction of trade size
depth_min_pct = 0.20
# No entries within this many seconds of market expiry
entry_cutoff_secs = 20
# Max age (ms) of Binance SBE event before discard
binance_stale_event_ms = 150
# Max age (ms) of Polymarket book before blocking entry
stale_book_ms = 850
# Cancel unfilled Leg 1 after this many ms
leg1_timeout_ms = 2500
# Quiet period (ms) after market rotation before allowing trades
rotation_quiet_ms = 0
# Cooldown (ms) after trade completion before allowing new entries
trade_cooldown_ms = 3000

[capital]
# Maximum USDC per leg per trade
max_alloc_per_trade = 15

[repricing]
# Minimum spike ATR ratio to trade (spikes below → f1 = 0)
min_spike_atr_ratio = 30
# Spike ATR ratio at which spike quality factor = 1.0
strong_spike_atr_ratio = 75
# Target profit for ideal signal and full allocation; may be increased by time amplification.
reprice_scale = 0.05
# Minimum model output to enter a trade (0.02 = 2.0%)
min_reprice_pct = 0.015
# Phase 1 target dampening (0.8 = target 80% of expected repricing)
phase1_target_dampen = 0.8
# Minimum OBI alignment (0.2 = reject if Binance book contradicts spike direction)
min_obi_alignment = 0.3
# Floor allocation fraction (0.3 = always use at least 30% of max_alloc)
min_alloc_pct = 0.3
# Hard reject: YES mid beyond this regardless of model
hard_skew_cap = 0.90
# Exponent for time amplification (0.5 = sqrt, 0 = disabled, 1.0 = linear)
time_exponent = 0.5
# Maximum time amplification factor (2.0 = time can at most double the output)
max_time_factor = 2.25

[risk]
# Phase 1 timeout (ms) — time at profit target before transitioning to Phase 2
phase1_timeout_ms = 2000
# Book depth > this × avg = competitor wall (outbid by 1 tick)
depth_wall_multiplier = 4.0
# Phase 1 breach: pair cost > this triggers immediate FOK exit
phase1_breach_threshold = 1.02
# Phase 2 timeout (ms) — time at break-even pursuit before FOK taker exit
phase2_timeout_ms = 2500
# Timeout (ms) for favorable maker try before FOK fallback on crosses-book
favorable_maker_timeout_ms = 3000
