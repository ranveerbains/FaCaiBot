
[rotation]
# Seconds before expiry to discover and pre-fetch the next market
prewarm_lead_secs = 20

[spike_detection]
# ATR multiplier for spike candidate trigger
multiplier = 25
# EMA smoothing for ATR (0.02 = 2.5s memory at 50ms ticks)
atr_alpha = 0.02
# Sustain duration (ms) before spike confirmation
sustain_ms = 300
# Minimum spike magnitude in bps (0.01 = 1 bp hard floor)
min_magnitude_pct = 0.012
# Minimum displacement/peak ratio at sustain time
momentum_ratio_min = 0.75

[entry_guards]
# Maximum bid-ask spread in dollars
max_spread = 0.02
# Minimum book depth as fraction of trade size
depth_min_pct = 0.20
# No entries within this many seconds of market expiry
entry_cutoff_secs = 25
# Max age (ms) of Binance SBE event before discard
binance_stale_event_ms = 150
# Max age (ms) of Polymarket book before blocking entry
stale_book_ms = 1000
# Block entry if YES mid > this or < (1 - this)
max_price_skew = 0.85
# Cancel unfilled Leg 1 after this many ms
leg1_timeout_ms = 2500
# Quiet period (ms) after market rotation before allowing trades
rotation_quiet_ms = 0
# Cooldown (ms) after trade completion before allowing new entries
trade_cooldown_ms = 5000

[capital]
# Maximum USDC per leg per trade
max_alloc_per_trade = 9
# Fraction of max_alloc for each confidence tier
high_alloc_pct = 1
med_alloc_pct = 0.8
low_alloc_pct = 0.5

[confidence]
# Score >= this → HIGH tier (max score 0.8)
high_threshold = 0.5
# Score >= this → MED tier, below → LOW
med_threshold = 0.35
# Profit target % for HIGH tier
high_target_pct = 0.03
# Profit target % for MED tier
med_target_pct = 0.02
# Profit target % for LOW tier
low_target_pct = 0.02
# Minimum spike ATR ratio to trade (spikes below → f1 = 0)
min_spike_atr_ratio = 20
# Spike ATR ratio at which spike quality factor = 1.0
strong_spike_atr_ratio = 75

[risk]
# Binance reversal fraction triggering immediate emergency FOK. this is in % of btc.
adverse_threshold = 0.001
# Phase 1 timeout (ms) — time at profit target before transitioning to Phase 2
phase1_timeout_ms = 2000
# Book depth > this × avg = competitor wall (outbid by 1 tick)
depth_wall_multiplier = 4.0
# Hard deadline (ms) from first emergency post to FOK taker fallback
emergency_deadline_ms = 2000
# Phase 1 breach: pair cost > this triggers transition to Phase 2
phase1_breach_threshold = 1.04
