[rotation]
prewarm_lead_secs = 20

[fair_value]
# Momentum signal weights (futures-derived leading indicators)
momentum_weight_basis = 0.10
momentum_weight_cvd = 0.05
momentum_weight_obi = 0.05
max_momentum_adj = 0.08
# Edge scaling
vol_edge_scale = 0.5
time_edge_scale = 0.02
baseline_vol = 0.00003
# Realized vol tracker
vol_ring_capacity = 600          # ~30s lookback at 20 ticks/sec
vol_session_capacity = 6000      # full 5-min session
vol_freshness_ms = 500           # stale if no update in 500ms
vol_min_warmup = 10              # minimum samples before valid vol
vol_default = 0.00003            # default vol before warmup
vol_ticks_per_sec = 20.0         # BinanceTick cadence
# Model params
tail_compression_factor = 0.85   # compress z-score to fatten tails
stale_data_edge_penalty = 0.01   # extra edge per stale momentum feed
regime_spike_threshold = 2.0     # short_vol / session_vol ratio trigger
regime_spike_penalty = 0.01      # extra edge during regime spike
strike_warmup_count = 5          # median of first N ticks for strike
# Momentum metric tracker params
basis_halflife_ms = 250
basis_freshness_ms = 150
basis_min = 0.0
basis_saturation = 0.05
cvd_fast_halflife_ms = 200
cvd_slow_halflife_ms = 500
cvd_freshness_ms = 150
cvd_min = 0.0
cvd_saturation = 0.6
obi_halflife_ms = 250
obi_freshness_ms = 120
obi_min = 0.0
obi_saturation = 0.2

[quoting]
# Edge (minimum profit margin per share)
min_edge = 0.03
# Requoting
requote_threshold = 0.01
min_requote_interval_ms = 3500
emergency_requote_threshold = 0.05  # bypass interval if FV drift >= this
# Order sizing
max_order_size = 5
min_order_size = 5
# Inventory skewing — scales linearly with imbalance ratio
max_imbalance_skew = 0.02           # max skew at full imbalance (replaces flat ±0.01)

[risk_v2]
# Per-side exposure limits
max_unpaired_shares = 5
max_unpaired_usdc = 5
# Market-wide limits
max_capital_per_market = 30
# Timing
closing_phase_secs = 45
rotation_quiet_ms = 5000
# Closing phase
max_closing_pair_cost = 0.97
max_closing_attempts = 3             # multi-attempt FOK (was 1 one-shot)
closing_retry_price_increment = 0.01 # accept 1 tick worse per retry
# Taker rebalance (active imbalance correction)
rebalance_threshold = 10            # shares imbalance to trigger taker rebalance
rebalance_size = 10                  # shares per rebalance order
rebalance_max_pair_cost = 0.96       # max pair cost for rebalance (tighter than closing)
min_rebalance_interval_ms = 5000    # 10s cooldown between rebalances
# Data quality
stale_book_ms = 850
max_entry_spread = 0.04
heartbeat_dead_threshold = 5
binance_stale_event_ms = 150
