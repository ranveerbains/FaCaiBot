[rotation]
prewarm_lead_secs = 20

[fair_value]
# Momentum signal weights (futures-derived leading indicators)
momentum_weight_basis = 0.10
momentum_weight_cvd = 0.05
momentum_weight_obi = 0.05
max_momentum_adj = 0.08
# Edge scaling
vol_edge_scale = 0.05
time_edge_scale = 0.01
baseline_vol = 0.00003
# Realized vol tracker
vol_ring_capacity = 600          # ~30s lookback at 20 ticks/sec
vol_session_capacity = 6000      # full 5-min session
vol_freshness_ms = 500           # stale if no update in 500ms
vol_min_warmup = 10              # minimum samples before valid vol
vol_default = 0.00001            # default vol before warmup (1/3 baseline for reasonable starting edge)
vol_ticks_per_sec = 20.0         # BinanceTick cadence
# Model params
vol_floor = 0.00002              # minimum per-tick vol — prevents overconfidence during calm periods
tail_compression_factor = 0.75   # compress z-score to fatten tails (lower = fatter tails, more uncertain)
stale_data_edge_penalty = 0.01   # extra edge per stale momentum feed
regime_spike_threshold = 2.0     # short_vol / session_vol ratio trigger
regime_spike_penalty = 0.01      # extra edge during regime spike
strike_warmup_count = 5          # median of first N ticks for strike
# Momentum metric tracker params
basis_halflife_ms = 250
basis_freshness_ms = 150
basis_min = 0.0
basis_saturation = 0.05
cvd_fast_halflife_ms = 200
cvd_slow_halflife_ms = 500
cvd_freshness_ms = 150
cvd_min = 0.0
cvd_saturation = 0.6
obi_halflife_ms = 250
obi_freshness_ms = 120
obi_min = 0.0
obi_saturation = 0.2
# Level-based signal weights (persistent state, not velocity)
momentum_weight_cvd_level = 0.04
momentum_weight_obi_level = 0.03
momentum_weight_basis_level = 0.05
momentum_weight_spot_cvd = 0.04
momentum_weight_liquidation = 0.03
# CVD level tracker (long-EMA of signed volume)
cvd_level_halflife_ms = 3000
cvd_level_freshness_ms = 500
cvd_level_saturation = 5.0
# OBI level tracker (EMA of raw OBI)
obi_level_halflife_ms = 1500
obi_level_freshness_ms = 300
obi_level_saturation = 0.3
# Basis level tracker (EMA of absolute basis bps)
basis_level_halflife_ms = 2000
basis_level_freshness_ms = 500
basis_level_saturation = 3.0
# Spot CVD tracker (spot trade flow acceleration)
spot_cvd_fast_halflife_ms = 300
spot_cvd_slow_halflife_ms = 800
spot_cvd_freshness_ms = 300
spot_cvd_saturation = 0.6
# Liquidation tracker
liquidation_halflife_ms = 1000
liquidation_freshness_ms = 3000
liquidation_saturation = 10.0
# Momentum mode
use_logit_momentum = true     # apply momentum in log-odds space (more correct)
momentum_time_decay = true    # scale momentum by time remaining

[quoting]
# Edge (minimum profit margin per share)
min_edge = 0.04
# Requoting
requote_threshold = 0.01
# Order sizing
max_order_size = 10
min_order_size = 5
max_fair_value_extremity = 0.78      # don't quote when either FV > this (pairing infeasible)

[risk_v2]
# Per-side exposure limits
max_unpaired_shares = 10
# Timing
rotation_quiet_ms = 10000
# Taker rebalance (active imbalance correction)
rebalance_threshold = 4.99             # shares imbalance to trigger taker rebalance
rebalance_size = 30                   # shares per rebalance order
rebalance_max_pair_cost = 0.98      # max pair cost for rebalance (only rebalance when profitable)
# Data quality
stale_book_ms = 850
heartbeat_dead_threshold = 5
binance_stale_event_ms = 150
# Buildup guard — weighted composite score with direction consensus + causal ordering
buildup_go_dark_threshold = 0.2   # go dark when composite score >= this (weighted: 0.4×CVD + 0.3×basis + 0.3×OBI)
buildup_go_live_threshold = 0.05    # resume when score drops below this
