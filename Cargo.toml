[package]
name = "facaibot"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Polymarket CLOB client (market reads, orders, WebSocket streaming)
polymarket-client-sdk = { version = "0.4", features = ["clob"] }

# UUID parsing for API key
uuid = "1"

# EVM / Polygon interactions, EIP-712 signing
alloy = { version = "1.7", features = ["signers", "signer-local"] }

# Low-latency SIMD-accelerated WebSocket client
fastwebsockets = { version = "0.10", features = ["upgrade"] }

# Lock-free channels (SPSC between layers)
crossbeam-channel = "0.5"

# Cold storage — QuestDB time-series ingestion (analytics only, not on execution path)
questdb-rs = "4.0"

# Fixed-point arithmetic (no floats)
rust_decimal = { version = "1", features = ["serde-with-str"] }

# CPU core pinning for ingestor thread
core_affinity = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment config
dotenvy = "0.15"

# TOML config file parsing
toml = "0.8"

# Error handling
anyhow = "1"

# HTTP client (order submission, REST polling)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Hyper (required by fastwebsockets upgrade)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
